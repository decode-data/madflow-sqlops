[project]
name = "madflow-sqlops"
version = "0.1.0"
description = "gdt reference implementation: tag SQL operations against sqlglot ASTs per the Grammar of Data Transformation spec."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jim Barlow", email = "jim@decodedata.io" }
]
requires-python = ">=3.10"
keywords = ["sql", "sqlglot", "gdt", "sql-parsing", "data-transformation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot==30.17.0",
    "jsonschema>=4.26,<5",
]

[project.urls]
Homepage = "https://github.com/decode-data/madflow-sqlops"
Repository = "https://github.com/decode-data/madflow-sqlops"
Issues = "https://github.com/decode-data/madflow-sqlops/issues"
"gdt spec" = "https://github.com/decode-data/gdt"

[project.scripts]
madflow-sqlops = "madflow_sqlops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
